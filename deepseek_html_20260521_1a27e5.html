<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Экран подключения -->
        <div id="join-screen" class="screen">
            <div class="logo">
                <h1>Simple Chat</h1>
                <p>Защищённое общение 1‑на‑1</p>
            </div>
            <div class="join-actions">
                <button id="create-btn" class="btn primary">Создать чат</button>
                <div class="divider">или</div>
                <div class="join-form">
                    <input type="text" id="remote-id-input" placeholder="Код собеседника">
                    <button id="connect-btn" class="btn secondary">Подключиться</button>
                </div>
            </div>
            <div id="my-id-display" class="id-display hidden">
                Ваш код: <span id="my-id-text"></span>
                <button id="copy-id-btn" class="btn small">Копировать</button>
            </div>
            <button id="profile-btn-join" class="btn small profile-btn">Профиль</button>
        </div>

        <!-- Экран чата -->
        <div id="chat-screen" class="screen hidden">
            <div class="chat-header">
                <button id="back-btn" class="btn icon">&larr;</button>
                <div class="chat-partner-info">
                    <img id="partner-avatar" src="" alt="avatar" class="avatar small">
                    <span id="partner-name">Собеседник</span>
                </div>
                <button id="profile-btn-chat" class="btn icon">&#9881;</button>
            </div>
            <div id="messages-container" class="messages"></div>
            <div class="chat-input-area">
                <label for="file-input" class="file-label">&#128206;</label>
                <input type="file" id="file-input" accept="image/*" hidden>
                <div id="message-input" contenteditable="true" placeholder="Сообщение..."></div>
                <button id="send-btn" class="btn primary send-btn">&#10148;</button>
            </div>
        </div>

        <!-- Модальное окно профиля -->
        <div id="profile-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Профиль</h2>
                <div class="profile-avatar-upload">
                    <img id="profile-avatar-preview" src="" alt="Фото профиля">
                    <label for="avatar-input" class="btn small">Загрузить фото</label>
                    <input type="file" id="avatar-input" accept="image/*" hidden>
                </div>
                <div class="profile-field">
                    <label>Имя</label>
                    <input type="text" id="profile-name" placeholder="Ваше имя">
                </div>
                <div class="profile-field">
                    <label>Статус</label>
                    <input type="text" id="profile-status" placeholder="О себе">
                </div>
                <button id="save-profile-btn" class="btn primary">Сохранить</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
