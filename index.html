<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Simple Chat — зашифрованный диалог 1‑на‑1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Токен и данные репозитория (не коммитится) -->
    <script src="token.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="startScreen" class="screen active">
        <div class="card">
            <h1>🔒 Simple Chat</h1>
            <p>Личные зашифрованные диалоги 1‑на‑1</p>
            <div class="input-group">
                <input type="text" id="roomCodeInput" placeholder="Код комнаты (например: ABC123XY)" maxlength="20">
                <button id="joinBtn" class="btn-primary">Войти</button>
            </div>
            <div class="divider">— или —</div>
            <button id="createBtn" class="btn-secondary">✨ Создать новую комнату</button>
            <div id="startError" class="error-msg hidden"></div>
        </div>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chatScreen" class="screen">
        <div class="chat-header">
            <div class="room-info">
                <span class="room-code-label">Код комнаты:</span>
                <span id="roomCodeDisplay" class="room-code"></span>
                <button id="copyCodeBtn" class="icon-btn" title="Копировать код">📋</button>
            </div>
            <button id="exitBtn" class="exit-btn">🚪 Выйти</button>
        </div>
        <div id="messagesContainer" class="messages-container">
            <!-- Сообщения будут добавлены динамически -->
            <div class="empty-chat-placeholder">💬 Нет сообщений. Напишите первое!</div>
        </div>
        <div class="message-input-area">
            <textarea id="messageInput" rows="1" placeholder="Введите сообщение..."></textarea>
            <button id="sendBtn" class="send-btn" aria-label="Отправить">➤</button>
        </div>
        <div class="status-bar" id="statusBar"></div>
    </div>

    <div id="toast" class="toast hidden"></div>
</body>
</html>
