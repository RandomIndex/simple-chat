<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat — Чистый чат</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="chat-container">
        <!-- Заголовок -->
        <div class="chat-header">
            <h1>Simple Chat</h1>
        </div>

        <!-- Панель подключения -->
        <div id="connection-panel">
            <div class="my-code-box">
                <span class="label">Ваш код:</span>
                <span id="my-code" class="code-value">—</span>
                <button id="copy-code-btn" class="btn small" title="Копировать код">📋</button>
                <button id="new-chat-btn" class="btn small danger" title="Новый код">🔄</button>
            </div>
            <div class="connect-row">
                <input type="text" id="remote-id-input" placeholder="Введите код собеседника">
                <button id="connect-btn" class="btn primary">Подключиться</button>
            </div>
            <div id="status-text" class="status-message"></div>
        </div>

        <!-- Сообщения -->
        <div id="messages-container"></div>

        <!-- Ввод сообщения -->
        <div id="input-panel">
            <div id="message-input" contenteditable="true" placeholder="Введите сообщение..."></div>
            <button id="send-btn" class="btn primary icon">➤</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
